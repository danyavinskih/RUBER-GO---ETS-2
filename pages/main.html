<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RUBER GO — Главный экран</title>
<style>
:root{--navy:#06152f;--panel:#102b54;--blue:#087bff;--blue2:#36aaff;--muted:#a9c0e2;--nav-height:76px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html,body{width:100%;min-height:100%;background:#06152f;color:#fff}
button,input{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:flex}

/* Главное меню */
#homeScreen{background:#dce5e8;overflow:hidden}
.map{position:absolute;inset:-3%;overflow:hidden;background:#e9e9e6;touch-action:pan-x pan-y}
.map svg{width:100%;height:100%;display:block}
.map:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#06152f24,transparent 22%,transparent 70%,#06152f14);pointer-events:none}
.brand{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 42px);left:17px;padding:9px 13px;border-radius:13px;background:#071a36ef;box-shadow:0 5px 20px #00152e35;font-weight:900;letter-spacing:1px}
.brand span{color:#44aaff}
.shift-indicator{appearance:none;position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 16px);left:17px;width:46px;height:26px;border-radius:20px;background:#d83c4c;box-shadow:0 3px 14px #00152e35;padding:3px;display:flex;align-items:center;justify-content:flex-start;transition:background .2s}
.shift-indicator{width:54px;height:30px;border:1px solid #ffffff45;background:linear-gradient(135deg,#a9344c,#e34e63);box-shadow:0 5px 18px #06152f55,inset 0 1px 2px #ffffff35;border-radius:20px;padding:3px;display:flex;align-items:center;justify-content:flex-start;transition:background .22s,box-shadow .22s}
.shift-indicator span{width:22px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:transform .2s}
.shift-indicator.is-online{background:linear-gradient(135deg,#087bff,#36aaff);box-shadow:0 5px 20px #087bff55,inset 0 1px 2px #ffffff55}
.shift-indicator.is-online span{transform:translateX(24px)}
.locator{position:absolute;z-index:3;top:39%;left:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 5px #0005)}
.locator svg{width:54px;height:62px}
.map-recenter{position:absolute;z-index:4;right:17px;bottom:calc(var(--nav-height) + 18px);width:45px;height:45px;border-radius:50%;background:#fff;color:#102b50;font-size:22px;box-shadow:0 4px 18px #00152e30}
.sheet{position:absolute;z-index:5;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom));height:47vh;min-height:280px;max-height:80vh;border-radius:27px 27px 0 0;background:linear-gradient(155deg,#102b54,#081a36 90%);border:1px solid #65a8f344;border-bottom:0;box-shadow:0 -12px 35px #06152f35;display:flex;flex-direction:column;transition:transform .28s ease;transform:translateY(0)}
.sheet.collapsed{transform:translateY(calc(100% - 38px))}
.sheet.expanded{height:78vh}
.handle-area{padding:10px 20px 7px;flex:none;touch-action:none;cursor:grab;user-select:none}
.handle{width:43px;height:5px;margin:0 auto 7px;border-radius:9px;background:#83a9d188}
.sheet-caption{text-align:center;color:#8eacd4;font-size:10px;letter-spacing:.5px}
.sheet-body{padding:3px 16px 12px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;background:#ffffff0b;border:1px solid #ffffff12;border-radius:17px;padding:13px 4px;margin-bottom:11px}
.stat{display:flex;justify-content:center;align-items:center;gap:9px;min-width:0}
.stat+.stat{border-left:1px solid #ffffff20}
.stat-icon{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#1685ff35,#36aaff12);border:1px solid #62b5ff35;color:#83caff;box-shadow:inset 0 1px 0 #ffffff18,0 4px 14px #006eff18}.stat-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat-label{font-size:11px;color:#a9c0e2}.stat-value{font-size:19px;font-weight:850;margin-top:1px;white-space:nowrap}
.tariff-card{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:14px 15px;margin-bottom:10px;border-radius:16px;color:#fff;background:linear-gradient(105deg,#123c73,#0d2b56);border:1px solid #3f83cf55}
.tariff-card .small{font-size:11px;color:#a9c0e2;margin-bottom:3px}.tariff-card strong{font-size:15px}
.tariff-pill{background:#087bff24;border:1px solid #258dff66;color:#8ecaff;border-radius:20px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.bonus{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff10;margin-bottom:12px}
.bonus .time{font-size:13px;font-weight:750}.bonus .muted{font-size:11px;color:#9eb7dc;margin-top:3px}
.bonus .percent{font-size:19px;font-weight:900;color:#65b7ff;white-space:nowrap}
.online{touch-action:pan-y;user-select:none;-webkit-user-select:none;height:78px;border-radius:22px;padding:6px;display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#087bff,#1769ed);box-shadow:0 8px 24px #006eff35;margin-bottom:12px}
.online.online-now{background:linear-gradient(100deg,#087bff,#1769ed)}
.slider-knob{width:64px;height:64px;flex:none;border-radius:18px;background:#fff;color:#087bff;display:grid;place-items:center;font-size:33px;box-shadow:0 3px 12px #001b3b35;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.online.online-now .slider-knob{color:#087bff}
.online-copy{text-align:center;flex:1;padding-right:12px;line-height:1.25}.online-copy .state{font-size:12px;opacity:.9}.online-copy strong{display:block;font-size:16px}.online-copy .online-headline{font-weight:900}
.top-online-status{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);display:none;min-width:142px;padding:9px 17px 10px;border-radius:17px;text-align:center;color:#fff;background:rgba(6,25,52,.88);border:1px solid #75baff66;box-shadow:0 8px 26px #06152f35;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);line-height:1.2;pointer-events:none}
.top-online-status.visible{display:block}
.top-online-status .state{display:block;font-size:14px;font-weight:750;letter-spacing:.15px}
.top-online-status strong{display:block;margin-top:3px;font-size:14px;font-weight:850;color:#8ecaff}
.top-online-status.searching strong{animation:searchPulse 1.5s ease-in-out infinite}
@keyframes searchPulse{0%,100%{opacity:1}50%{opacity:.58}}
.nav{position:absolute;z-index:7;left:0;right:0;bottom:0;height:calc(var(--nav-height) + env(safe-area-inset-bottom));padding:8px 5px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(180deg,#0b2345,#06152f);border-top:1px solid #65a8f333;box-shadow:0 -8px 25px #00152e35}
.nav button{background:transparent;color:#8da9cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 0;font-size:10px}
.nav button.active{color:#fff}.nav-icon{width:24px;height:24px;display:grid;place-items:center;color:#8da9cf}
.nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.active .nav-icon{color:#55adff}
.modal-backdrop{position:absolute;z-index:10;inset:0;background:#020b1bcc;display:none;align-items:flex-end;justify-content:center;padding:15px}
.modal-backdrop.show{display:flex}
.modal{width:100%;max-width:480px;border-radius:24px;padding:20px;background:linear-gradient(155deg,#153660,#091b37);border:1px solid #65a8f344;box-shadow:0 15px 50px #0008}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal h2{font-size:21px;margin:0}.close{width:32px;height:32px;border-radius:50%;background:#ffffff16;color:#fff;font-size:20px}
.modal-desc{font-size:12px;color:#a9c0e2;margin-bottom:15px;line-height:1.45}
.tariff-option{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:14px;margin-top:8px;border-radius:14px;color:white;background:#ffffff0c;border:1px solid #ffffff18}
.tariff-option.selected{border-color:#329cff;background:#087bff24}
.tariff-option strong{display:block;font-size:15px}.tariff-option small{display:block;color:#a9c0e2;margin-top:3px;font-size:11px}.check{color:#68baff;font-size:20px}
.toast{position:absolute;z-index:12;left:50%;bottom:calc(var(--nav-height) + 85px);transform:translateX(-50%);padding:10px 14px;background:#061a35ed;border:1px solid #4a8bd366;border-radius:12px;color:#eaf5ff;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:370px){.sheet-body{padding-left:11px;padding-right:11px}.stat-value{font-size:17px}.tariff-card{padding:12px}.online{height:72px}.slider-knob{width:60px;height:60px}}
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<section class="screen active" id="homeScreen">
  <div class="map" id="map">
    <!-- Временная схематичная карта. Позже подключим карту ETS2. -->
    <svg viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice" aria-label="Временная карта">
      <rect width="430" height="900" fill="#efefec"/>
      <g fill="#e2e3e1" opacity=".8">
        <path d="M0 35h105v80H0zM130 10h100v100H130zM260 0h130v85H260zM15 160h95v90H15zM140 145h105v95H140zM280 130h130v105H280zM0 300h110v90H0zM140 285h110v105H140zM280 280h130v100H280zM15 440h100v105H15zM145 430h105v105H145zM280 420h120v115H280zM0 590h115v100H0zM140 575h110v110H140zM280 570h130v105H280zM15 735h105v100H15zM150 720h100v110H150zM285 720h120v100H285z"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="12">
        <path d="M-20 125L450 125M-20 260L450 260M-20 395L450 395M-20 535L450 535M-20 680L450 680M75 -20L75 930M190 -20L190 930M310 -20L310 930"/>
      </g>
      <g fill="none" stroke="#c9d0d0" stroke-width="1.4">
        <path d="M-20 125L450 125M-20 260L450 260M-20 395L450 395M-20 535L450 535M-20 680L450 680M75 -20L75 930M190 -20L190 930M310 -20L310 930M0 60L430 190M0 220L430 350M0 500L430 610M0 790L430 870"/>
      </g>
      <g fill="none" stroke="#45b96a" stroke-width="4">
        <path d="M28 -10L28 920M42 -10L42 920M335 -10L335 920M350 -10L350 920M-10 265L440 265M-10 278L440 278M-10 690L440 690"/>
      </g>
      <g fill="none" stroke="#e9b83e" stroke-width="3"><path d="M0 405L430 405M0 416L430 416M180 125L180 260M190 535L190 690"/></g>
      <g fill="#a5a8aa" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">
        <text x="125" y="100">ЦЕНТР ГОРОДА</text><text x="225" y="245">ГОРОДСКОЙ РАЙОН</text>
        <text x="95" y="510">УЛИЦА МИРА</text><text x="235" y="650">ПРОСПЕКТ</text><text x="120" y="820">ЖИЛОЙ РАЙОН</text>
      </g>
    </svg>
  </div>
  <button class="shift-indicator" id="shiftIndicator" aria-label="Завершить смену" title="Завершить смену"><span></span></button>
  <div class="top-online-status" id="topOnlineStatus"><span class="state">Онлайн</span><strong>Ищем заказы</strong></div>
  <div class="locator"><svg viewBox="0 0 60 70"><path d="M30 2L54 62L30 51L6 62Z" fill="#f7f7f7" stroke="#23344c" stroke-width="2"/><path d="M30 2L30 51L6 62Z" fill="#6e7782"/><path d="M30 2L54 62L30 51Z" fill="#f5f7f8"/></svg></div>
  <button class="map-recenter" id="recenter">◎</button>

  <section class="sheet" id="sheet">
    <div class="handle-area" id="handleArea"><div class="handle"></div><div class="sheet-caption">ПОТЯНИ ВВЕРХ ИЛИ ВНИЗ</div></div>
    <div class="sheet-body">
      <div class="stats">
        <div class="stat"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H20v14H6.5A2.5 2.5 0 0 1 4 16.5z"/><path d="M4 8h13M8 11h8M8 14h5"/></svg></div><div><div class="stat-label">Заказы</div><div class="stat-value" id="orders">0 заказов</div></div></div>
        <div class="stat"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15 8.5c-.7-.6-1.7-.9-2.8-.9-1.5 0-2.6.7-2.6 1.8 0 2.9 5.6 1.1 5.6 4 0 1.2-1.2 2-2.9 2-1.2 0-2.4-.4-3.2-1.1M12 5.5v13"/></svg></div><div><div class="stat-label">Баланс</div><div class="stat-value" id="balance">0 Руб</div></div></div>
      </div>
      <button class="tariff-card" id="openTariffs">
        <span><span class="small">Выбранный тариф</span><br><strong id="currentTariff">Комфорт</strong></span>
        <span class="tariff-pill">Сменить тариф　›</span>
      </button>
      <div class="bonus"><div><div class="time">07:20 — 08:49</div><div class="muted">Бонусы в городе · пример</div></div><div class="percent">+13 — 17%</div></div>
      <div class="online" id="onlineControl">
        <button class="slider-knob" id="sliderKnob" aria-label="Переключить статус">➜</button>
        <div class="online-copy"><strong class="online-headline" id="onlineText">Выйти на линию</strong></div>
      </div>
    </div>
  </section>
  <nav class="nav">
    <button class="active" data-tab="Заказы"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><circle cx="7" cy="6.5" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="9" cy="17.5" r="1.5"/></svg></span><span>Заказы</span></button>
    <button data-tab="Деньги"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M3.5 10h17M7 14.5h3"/></svg></span><span>Деньги</span></button>
    <button data-tab="Чаты"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-2.5 2v-6A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11.5h8M8 14.5h5"/></svg></span><span>Чаты</span></button>
    <button data-tab="Профиль"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span>Профиль</span></button>
  </nav>

  <div class="modal-backdrop" id="tariffModal">
    <div class="modal">
      <div class="modal-head"><h2>Выбери тариф</h2><button class="close" id="closeModal">×</button></div>
      <p class="modal-desc">Выбери класс поездок, которые хочешь получать в RUBER GO.</p>
      <button class="tariff-option selected" data-tariff="Комфорт"><span><strong>Комфорт</strong><small>Повседневные поездки</small></span><span class="check">✓</span></button>
      <button class="tariff-option" data-tariff="Комфорт+"><span><strong>Комфорт+</strong><small>Больше пространства и удобства</small></span><span class="check"></span></button>
      <button class="tariff-option" data-tariff="Бизнес"><span><strong>Бизнес</strong><small>Премиальный класс обслуживания</small></span><span class="check"></span></button>
      <button class="tariff-option" data-tariff="Минивэн"><span><strong>Минивэн</strong><small>Для поездок компанией</small></span><span class="check"></span></button>
      <button class="tariff-option" data-tariff="Грузовой"><span><strong>Грузовой</strong><small>Перевозка грузов в ETS2</small></span><span class="check"></span></button>
    </div>
  </div>
  <div class="toast" id="toast">Карта временная — позже подключим ETS2</div>
</section>

<script>
/* ЛОГИКА ШТОРКИ: вниз до ручки, вверх до половины/расширения */
const sheet=document.getElementById('sheet');
const handleArea=document.getElementById('handleArea');
let sheetStartY=0, sheetDragging=false;
function setSheet(position){
  sheet.classList.toggle('collapsed',position==='down');
  sheet.classList.toggle('expanded',position==='up');
}
handleArea.addEventListener('pointerdown',e=>{
  sheetStartY=e.clientY;sheetDragging=true;
  handleArea.setPointerCapture(e.pointerId);
});
handleArea.addEventListener('pointerup',e=>{
  if(!sheetDragging)return;
  const delta=e.clientY-sheetStartY;
  if(delta>35)setSheet('down');
  else if(delta< -35)setSheet('up');
  else if(sheet.classList.contains('collapsed'))setSheet('half');
  else if(sheet.classList.contains('expanded'))setSheet('half');
  else setSheet('down');
  sheetDragging=false;
});
handleArea.addEventListener('pointercancel',()=>sheetDragging=false);

/* ВЫБОР ТАРИФА */
const modal=document.getElementById('tariffModal');
document.getElementById('openTariffs').addEventListener('click',()=>modal.classList.add('show'));
document.getElementById('closeModal').addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show');});
document.querySelectorAll('.tariff-option').forEach(option=>{
  option.addEventListener('click',()=>{
    document.querySelectorAll('.tariff-option').forEach(x=>{x.classList.remove('selected');x.querySelector('.check').textContent='';});
    option.classList.add('selected');option.querySelector('.check').textContent='✓';
    document.getElementById('currentTariff').textContent=option.dataset.tariff;
    modal.classList.remove('show');showToast('Выбран тариф: '+option.dataset.tariff);
  });
});

/* ВЫХОД НА ЛИНИЮ: только перетаскиванием стрелки вправо */
let online=false, knobDragging=false, knobStartX=0, knobOffset=0;
const knob=document.getElementById('sliderKnob');
const onlineControl=document.getElementById('onlineControl');
const shiftIndicator=document.getElementById('shiftIndicator');
shiftIndicator.addEventListener('click',()=>{
  if(online) updateOnline(false);
  else showToast('Чтобы выйти на линию, перетащи стрелку вправо');
});
let searchTimer=null;
function startOrderSearch(){
  clearTimeout(searchTimer);
  // Имитация поиска: длительность каждого цикла случайная — от 10 до 60 секунд.
  const searchDuration=10000+Math.floor(Math.random()*50001);
  searchTimer=setTimeout(()=>{
    if(online){
      // Заказ пока не назначаем: поиск продолжается до следующего этапа приложения.
      startOrderSearch();
    }
  },searchDuration);
}
function updateOnline(value){
  online=value;
  onlineControl.classList.toggle('online-now',online);
  onlineControl.classList.toggle('searching',online);
  document.getElementById('topOnlineStatus').classList.toggle('visible',online);
  document.getElementById('topOnlineStatus').classList.toggle('searching',online);
  document.getElementById('onlineText').textContent=online?'На линии':'Выйти на линию';
  knob.textContent=online?'✓':'➜';
  const shiftIndicator=document.getElementById('shiftIndicator');
  shiftIndicator.classList.toggle('is-online',online);
  shiftIndicator.setAttribute('aria-label',online?'Завершить смену':'Смена не активна');
  knob.style.transform='';
  clearTimeout(searchTimer);
  if(online){
    startOrderSearch();
    showToast('Ты на линии — ищем заказы');
  }else{
    showToast('Ты завершил смену (демо)');
  }
}
knob.addEventListener('pointerdown',e=>{
  if(online)return;
  e.preventDefault();
  knobDragging=true;knobStartX=e.clientX;knobOffset=0;
  knob.setPointerCapture(e.pointerId);
});
knob.addEventListener('pointermove',e=>{
  if(!knobDragging)return;
  const max=Math.max(0,onlineControl.clientWidth-knob.offsetWidth-12);
  knobOffset=Math.max(0,Math.min(max,e.clientX-knobStartX));
  knob.style.transform=`translateX(${knobOffset}px)`;
});
function finishKnobDrag(){
  if(!knobDragging)return;
  const max=Math.max(1,onlineControl.clientWidth-knob.offsetWidth-12);
  knobDragging=false;
  if(knobOffset>=max*.55)updateOnline(true);
  else knob.style.transform='';
}
knob.addEventListener('pointerup',finishKnobDrag);
knob.addEventListener('pointercancel',()=>{
  knobDragging=false;knob.style.transform='';
});

/* ВСПОМОГАТЕЛЬНЫЕ ЭЛЕМЕНТЫ */
function showToast(message){
  const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2100);
}
document.getElementById('recenter').addEventListener('click',()=>showToast('Здесь позже появится позиция из ETS2'));
document.querySelectorAll('.nav button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
    if(button.dataset.tab!=='Заказы')showToast('Раздел «'+button.dataset.tab+'» добавим следующим этапом');
  });
});
</script>
</body>
</html>
